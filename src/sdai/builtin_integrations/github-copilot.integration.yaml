apiVersion: sdai.integration-manifest/v1
id: github-copilot
version: 1.0.0
displayName: GitHub Copilot CLI
description: Project skill projection plus safe advisory GitHub Copilot CLI execution.
capabilities:
  - agent-execution
  - skills
projections:
  - kind: skill
    source: .agents/skills
    target: .github/skills
execution:
  executable: copilot
  argsBeforeInput:
    - -s
    - --no-ask-user
    - --plan
    - --available-tools=view,grep,glob
    - --deny-tool=write
    - --deny-tool=shell
  inputMode: stdin
  inputPath: null
  argsAfterInput: []
  outputMode: stdout
  outputPath: null
  timeoutSeconds: 600
security:
  requiresNetwork: true
  requiresWorkspaceWrite: false
  environment:
    - GH_HOST
    - GH_TOKEN
    - GITHUB_TOKEN
