apiVersion: sdai.integration-manifest/v1
id: cursor
version: 1.0.0
displayName: Cursor
description: Mirror canonical Agent Skills into Cursor's project-native skill directory.
capabilities:
  - skills
projections:
  - kind: skill
    source: .agents/skills
    target: .cursor/skills
execution: null
security:
  requiresNetwork: false
  requiresWorkspaceWrite: false
  environment: []
