apiVersion: sdai.integration-manifest/v1
id: kiro
version: 1.0.0
displayName: Kiro
description: Mirror canonical Agent Skills into Kiro's project-native skill directory.
capabilities:
  - skills
projections:
  - kind: skill
    source: .agents/skills
    target: .kiro/skills
execution: null
security:
  requiresNetwork: false
  requiresWorkspaceWrite: false
  environment: []
