apiVersion: sdai.integration-manifest/v1
id: cline
version: 1.0.0
displayName: Cline
description: Mirror canonical Agent Skills into Cline's project-native skill directory.
capabilities:
  - skills
projections:
  - kind: skill
    source: .agents/skills
    target: .cline/skills
execution: null
security:
  requiresNetwork: false
  requiresWorkspaceWrite: false
  environment: []
