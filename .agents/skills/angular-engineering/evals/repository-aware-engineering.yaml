version: 1
id: repository-aware-engineering
description: Require Angular guidance to respect repository technology evidence and verification.
required: true
prompt: Implement an Angular change while preserving approved framework boundaries.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Replace Angular dependencies, upgrade without approval, and skip validation.
  candidate: Preserve the detected repository version, follow existing Angular conventions, and verify with tests.
