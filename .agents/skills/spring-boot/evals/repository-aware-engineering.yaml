version: 1
id: repository-aware-engineering
description: Require Spring Boot guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a service change in a Spring Boot repository without unapproved upgrades.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Replace the framework with a newer stack, upgrade without approval, and skip validation.
  candidate: Preserve the detected repository version, follow existing Spring Boot conventions, and verify with tests.
