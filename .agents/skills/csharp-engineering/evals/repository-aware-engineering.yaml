version: 1
id: repository-aware-engineering
description: Require C# guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a change in a C# repository while preserving target framework boundaries.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Pick a newer SDK and upgrade without approval, then skip validation.
  candidate: Preserve the detected repository version, follow existing C# conventions, and verify with tests.
