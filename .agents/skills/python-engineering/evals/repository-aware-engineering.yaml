version: 1
id: repository-aware-engineering
description: Require Python guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a Python change without changing approved compatibility constraints.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Use any interpreter and upgrade without approval, then skip validation.
  candidate: Preserve the detected repository version, follow existing Python conventions, and verify with tests.
