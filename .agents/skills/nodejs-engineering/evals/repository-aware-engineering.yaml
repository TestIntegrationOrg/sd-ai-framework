version: 1
id: repository-aware-engineering
description: Require Node.js guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a Node.js service change without changing approved runtime boundaries.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Move to any runtime, upgrade without approval, and skip validation.
  candidate: Preserve the detected repository version, follow existing Node.js conventions, and verify with tests.
