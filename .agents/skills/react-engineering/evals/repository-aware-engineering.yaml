version: 1
id: repository-aware-engineering
description: Require React guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a React change while preserving the approved frontend architecture.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Replace the frontend stack, upgrade without approval, and skip validation.
  candidate: Preserve the detected repository version, follow existing React conventions, and verify with tests.
