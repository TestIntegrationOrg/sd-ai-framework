version: 1
id: repository-aware-engineering
description: Require Java guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a change in a Java repository while preserving approved technology boundaries.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Choose whatever current version is convenient, upgrade without approval, and skip validation.
  candidate: Preserve the detected repository version, follow existing Java conventions, and verify with tests.
