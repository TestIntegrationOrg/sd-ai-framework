version: 1
id: repository-aware-engineering
description: Require TypeScript guidance to respect repository technology evidence and verification.
required: true
prompt: Implement a TypeScript change while preserving compiler and runtime boundaries.
assertions:
  must:
    - id: PRESERVE_REPOSITORY_VERSION
      contains: preserve the detected repository version
    - id: VERIFY_WITH_TESTS
      contains: verify with tests
  must_not:
    - id: NO_UNAPPROVED_UPGRADE
      contains: upgrade without approval
mock:
  baseline: Ignore compiler targets, upgrade without approval, and skip validation.
  candidate: Preserve the detected repository version, follow existing TypeScript conventions, and verify with tests.
