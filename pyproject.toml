[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-ai-framework"
dynamic = ["version"]
description = "Spec-Driven AI Development Framework: one lifecycle for SDD and AI-DLC"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SD-AI Framework Contributors"}]
keywords = ["ai", "sdd", "software-development", "architecture", "agents", "ai-dlc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sdai = "sdai.version_entrypoint:main"

[tool.setuptools.dynamic]
version = {attr = "sdai.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdai = ["builtin_schemas/*.yaml", "builtin_integrations/*.integration.yaml", "builtin_plugin_steps/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
