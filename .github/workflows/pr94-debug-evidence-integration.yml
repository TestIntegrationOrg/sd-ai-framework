name: PR94 Debug Evidence Integration

on:
  push:
    branches:
      - agent/issue-94-debugger-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-94-debugger-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add generic required completion evidence enforcement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"patch anchor not unique in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/sdai/execution_ledger.py")
          replace_once(
              path,
              '_SHA256 = re.compile(r"^sha256:[0-9a-f]{64}$")\n',
              '_SHA256 = re.compile(r"^sha256:[0-9a-f]{64}$")\n_EVIDENCE_CONTRACT = re.compile(\n    r"^[a-z0-9][a-z0-9._-]{0,63}(?:/[a-z0-9][a-z0-9._-]{0,63})+$"\n)\n',
          )
          anchor = '''    def write_task_brief(self, task_id: str, content: str) -> HashBinding:\n'''
          helpers = '''    def _validate_required_completion_evidence_declaration(\n        self,\n        payload: Mapping[str, object],\n    ) -> tuple[str, ...]:\n        raw = payload.get("required_completion_evidence")\n        if raw is None:\n            return ()\n        if not isinstance(raw, list) or not raw:\n            raise _fail(\n                "SDAI-LEDGER-009",\n                "required_completion_evidence must be a non-empty string list",\n            )\n        contracts: list[str] = []\n        for index, value in enumerate(raw):\n            if (\n                not isinstance(value, str)\n                or not value.strip()\n                or not _EVIDENCE_CONTRACT.fullmatch(value.strip())\n            ):\n                raise _fail(\n                    "SDAI-LEDGER-009",\n                    f"invalid required completion evidence contract at index {index}: {value!r}",\n                )\n            contracts.append(value.strip())\n        if len(contracts) != len(set(contracts)):\n            raise _fail(\n                "SDAI-LEDGER-009",\n                "required_completion_evidence must not contain duplicates",\n            )\n        return tuple(contracts)\n\n    def _required_completion_evidence(\n        self,\n        events: tuple[LedgerEvent, ...],\n        task_id: str,\n    ) -> tuple[str, ...]:\n        registration = next(\n            (\n                event\n                for event in events\n                if event.kind == "task.registered" and event.task_id == task_id\n            ),\n            None,\n        )\n        if registration is None:\n            return ()\n        return self._validate_required_completion_evidence_declaration(\n            registration.payload\n        )\n\n    def _validate_required_completion_evidence(\n        self,\n        events: tuple[LedgerEvent, ...],\n        task_id: str,\n        completion_bindings: tuple[HashBinding, ...],\n    ) -> None:\n        required = self._required_completion_evidence(events, task_id)\n        if not required:\n            return\n        boundary = 0\n        for event in events:\n            if (\n                event.task_id == task_id\n                and event.kind in {"task.registered", "task.reopened"}\n            ):\n                boundary = event.sequence\n        completion_keys = {\n            (binding.kind, binding.source, binding.sha256)\n            for binding in completion_bindings\n        }\n        satisfied: set[str] = set()\n        for event in events:\n            if (\n                event.sequence <= boundary\n                or event.task_id != task_id\n                or event.kind != "task.evidence"\n            ):\n                continue\n            contract = event.payload.get("evidence_contract")\n            if contract not in required or event.payload.get("completion_ready") is not True:\n                continue\n            if any(\n                (binding.kind, binding.source, binding.sha256) in completion_keys\n                for binding in event.bindings\n            ):\n                satisfied.add(str(contract))\n        missing = sorted(set(required) - satisfied)\n        if missing:\n            raise _fail(\n                "SDAI-LEDGER-009",\n                "task completion is missing completion-ready evidence from the current "\n                "attempt for contract(s): " + ", ".join(missing),\n            )\n\n''' + anchor
          replace_once(path, anchor, helpers)
          replace_once(
              path,
              '''        payload_dict = dict(payload or {})\n        _validate_json_value(payload_dict, label="event payload")\n        if (\n''',
              '''        payload_dict = dict(payload or {})\n        _validate_json_value(payload_dict, label="event payload")\n        if kind == "task.registered":\n            self._validate_required_completion_evidence_declaration(payload_dict)\n        if (\n''',
          )
          replace_once(
              path,
              '''            self._validate_transition(state, kind, task, commit, bindings)\n            if kind == "task.completed":\n                self._validate_completion_bindings(bindings)\n''',
              '''            self._validate_transition(state, kind, task, commit, bindings)\n            if kind == "task.completed":\n                assert task is not None\n                self._validate_required_completion_evidence(events, task, bindings)\n                self._validate_completion_bindings(bindings)\n''',
          )
          replace_once(
              path,
              '''            self._validate_transition(\n                provisional,\n                event.kind,\n                event.task_id,\n                event.git_commit,\n                event.bindings,\n            )\n            if event.kind == "run.created":\n''',
              '''            if event.kind == "task.registered":\n                self._validate_required_completion_evidence_declaration(event.payload)\n            if event.kind == "task.completed":\n                assert event.task_id is not None\n                self._validate_required_completion_evidence(\n                    events[:index],\n                    event.task_id,\n                    event.bindings,\n                )\n            self._validate_transition(\n                provisional,\n                event.kind,\n                event.task_id,\n                event.git_commit,\n                event.bindings,\n            )\n            if event.kind == "run.created":\n''',
          )
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run debugger, ledger, and resume regressions
        run: |
          pytest -q tests/test_debug_records_v09.py tests/test_execution_ledger_v09.py tests/test_execution_ledger_crash_recovery_v09.py tests/test_execution_ledger_schema_strictness_v09.py tests/test_execution_resume_v09.py
      - name: Commit integration changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdai/execution_ledger.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce declared completion evidence contracts (#94)"
          git push origin HEAD:agent/issue-94-debugger-evidence
