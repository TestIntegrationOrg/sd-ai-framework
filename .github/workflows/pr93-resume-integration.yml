name: PR93 Resume Integration

on:
  push:
    branches:
      - agent/issue-93-exact-resume

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-93-exact-resume
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch ledger and CLI integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"patch anchor not unique in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          ledger = Path("src/sdai/execution_ledger.py")
          replace_once(
              ledger,
              '        "task.started",\n        "task.implementation",\n',
              '        "task.started",\n        "task.reopened",\n        "task.dispatch_reserved",\n        "task.implementation",\n',
          )
          replace_once(
              ledger,
              '''        bindings: tuple[HashBinding, ...] = (),\n        payload: Mapping[str, object] | None = None,\n    ) -> LedgerEvent:\n        if kind not in _EVENT_KINDS:\n''',
              '''        bindings: tuple[HashBinding, ...] = (),\n        payload: Mapping[str, object] | None = None,\n        expected_last_sha256: str | None = None,\n    ) -> LedgerEvent:\n        if kind not in _EVENT_KINDS:\n''',
          )
          replace_once(
              ledger,
              '''        payload_dict = dict(payload or {})\n        _validate_json_value(payload_dict, label="event payload")\n        keys = [(item.kind, item.source) for item in bindings]\n''',
              '''        payload_dict = dict(payload or {})\n        _validate_json_value(payload_dict, label="event payload")\n        if (\n            expected_last_sha256 is not None\n            and not _SHA256.fullmatch(expected_last_sha256)\n        ):\n            raise _fail(\n                "SDAI-LEDGER-002",\n                f"invalid expected last ledger SHA-256: {expected_last_sha256!r}",\n            )\n        keys = [(item.kind, item.source) for item in bindings]\n''',
          )
          replace_once(
              ledger,
              '''            events = self._load_events_unlocked()\n            state = self._reconstruct_events(events)\n            self._validate_transition(state, kind, task, commit, bindings)\n''',
              '''            events = self._load_events_unlocked()\n            state = self._reconstruct_events(events)\n            if (\n                expected_last_sha256 is not None\n                and state.last_sha256 != expected_last_sha256\n            ):\n                raise _fail(\n                    "SDAI-LEDGER-008",\n                    "compare-and-append expectation no longer matches the current ledger head",\n                )\n            self._validate_transition(state, kind, task, commit, bindings)\n''',
          )
          replace_once(
              ledger,
              '''            if current is None:\n                raise _fail("SDAI-LEDGER-005", f"task '{task_id}' is not registered")\n            if current.status in _TASK_TERMINAL:\n                raise _fail(\n                    "SDAI-LEDGER-005",\n                    f"task '{task_id}' is already terminal ({current.status})",\n                )\n            if kind == "task.started":\n''',
              '''            if current is None:\n                raise _fail("SDAI-LEDGER-005", f"task '{task_id}' is not registered")\n            if kind == "task.reopened":\n                if current.status not in _TASK_TERMINAL:\n                    raise _fail(\n                        "SDAI-LEDGER-005",\n                        f"task '{task_id}' can reopen only from a terminal state, not {current.status}",\n                    )\n                return\n            if current.status in _TASK_TERMINAL:\n                raise _fail(\n                    "SDAI-LEDGER-005",\n                    f"task '{task_id}' is already terminal ({current.status})",\n                )\n            if kind == "task.dispatch_reserved":\n                if current.status not in {"registered", "started"}:\n                    raise _fail(\n                        "SDAI-LEDGER-005",\n                        f"task '{task_id}' cannot reserve dispatch from status {current.status}",\n                    )\n                return\n            if kind == "task.started":\n''',
          )
          replace_once(
              ledger,
              '''            elif event.kind == "task.started":\n                assert event.task_id is not None\n                tasks[event.task_id] = TaskExecutionState(event.task_id, "started")\n            elif event.kind == "task.completed":\n''',
              '''            elif event.kind == "task.started":\n                assert event.task_id is not None\n                tasks[event.task_id] = TaskExecutionState(event.task_id, "started")\n            elif event.kind == "task.reopened":\n                assert event.task_id is not None\n                tasks[event.task_id] = TaskExecutionState(event.task_id, "registered")\n            elif event.kind == "task.completed":\n''',
          )

          entry = Path("src/sdai/entrypoint.py")
          replace_once(
              entry,
              'from sdai.evals import MockEvalExecutor, run_behavioral_eval\n',
              'from sdai.evals import MockEvalExecutor, run_behavioral_eval\nfrom sdai.execution_cli import add_execution_parser, run_execution_command\n',
          )
          replace_once(
              entry,
              '    add_analysis_parser(commands)\n    return parser\n',
              '    add_analysis_parser(commands)\n    add_execution_parser(commands)\n    return parser\n',
          )
          replace_once(
              entry,
              '''    if args.managed_command == "analyze":\n        return run_analysis_command(root, args)\n\n    raise ValueError(f"Unknown managed command: {args.managed_command}")\n''',
              '''    if args.managed_command == "analyze":\n        return run_analysis_command(root, args)\n\n    if args.managed_command == "execution":\n        return run_execution_command(root, args)\n\n    raise ValueError(f"Unknown managed command: {args.managed_command}")\n''',
          )
          replace_once(
              entry,
              '''        "\\nCross-artifact analysis:\\n"\n        "  sdai analyze <feature> [--risk standard] [--json] [--path PATH]\\n"\n        "\\nExtension kinds: "\n''',
              '''        "\\nCross-artifact analysis:\\n"\n        "  sdai analyze <feature> [--risk standard] [--json] [--path PATH]\\n"\n        "\\nDurable execution resume:\\n"\n        "  sdai execution status <feature> --run <run-id> [--json] [--path PATH]\\n"\n        "  sdai execution resume <feature> --run <run-id> [--json] [--path PATH]\\n"\n        "\\nExtension kinds: "\n''',
          )
          replace_once(
              entry,
              '''        "workflow",\n        "analyze",\n    }:\n''',
              '''        "workflow",\n        "analyze",\n        "execution",\n    }:\n''',
          )
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run resume and ledger regression suites
        run: |
          pytest -q tests/test_execution_resume_v09.py tests/test_execution_ledger_v09.py tests/test_execution_ledger_crash_recovery_v09.py tests/test_execution_ledger_schema_strictness_v09.py
      - name: Commit integration changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdai/execution_ledger.py src/sdai/entrypoint.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate exact execution resume semantics (#93)"
          git push origin HEAD:agent/issue-93-exact-resume
