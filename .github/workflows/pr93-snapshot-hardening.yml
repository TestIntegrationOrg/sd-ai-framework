name: PR93 Snapshot Hardening

on:
  push:
    branches:
      - agent/issue-93-exact-resume

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-93-exact-resume
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harden resume snapshot consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/sdai/execution_resume.py")
          text = path.read_text(encoding="utf-8")
          old = "    events = ledger.load_events()\n    state = ledger.reconstruct()\n"
          new = "    events = ledger.load_events()\n    state = ledger._reconstruct_events(events)\n"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("resume snapshot patch anchor is not unique")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("resume snapshot patch anchor missing")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run resume regressions
        run: pytest -q tests/test_execution_resume_v09.py tests/test_execution_ledger_v09.py
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdai/execution_resume.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: build resume plan from one ledger snapshot (#93)"
          git push origin HEAD:agent/issue-93-exact-resume
