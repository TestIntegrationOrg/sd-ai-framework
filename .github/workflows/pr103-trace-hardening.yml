name: PR103 Trace Contract Hardening

on:
  push:
    branches:
      - agent/issue-103-trace-graph-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-103-trace-graph-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harden trace graph contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/sdai/trace_graph.py")
          replace_once(
              path,
              "from pathlib import PurePosixPath\n",
              "from pathlib import Path, PurePosixPath\n",
          )
          replace_once(
              path,
              "from sdai.models import validate_feature_id\n",
              "from sdai.models import validate_feature_id\nfrom sdai.path_safety import PathSafetyError, ensure_within_project\n",
          )
          replace_once(
              path,
              '''    normalized = dict(value)\n    _validate_json_value(normalized, label=label)\n    return normalized\n''',
              '''    normalized = dict(value)\n    _validate_json_value(normalized, label=label)\n    cloned = json.loads(\n        json.dumps(\n            normalized,\n            sort_keys=True,\n            ensure_ascii=False,\n            separators=(",", ":"),\n            allow_nan=False,\n        )\n    )\n    if not isinstance(cloned, dict):\n        raise _fail("SDAI-TRACE-001", f"{label} must normalize to a mapping")\n    return cloned\n''',
          )
          old = '''        return cls(\n            source=value["source"] if isinstance(value["source"], str) else "",\n            line=value["line"] if isinstance(value["line"], int) else 0,\n            detail=value.get("detail") if isinstance(value.get("detail"), str) else None,\n            declaration_sha256=(\n                value.get("declaration_sha256")\n                if isinstance(value.get("declaration_sha256"), str)\n                else None\n            ),\n        )\n\n\ndef _canonical_provenance(\n'''
          new = '''        source = value["source"]\n        line = value["line"]\n        detail = value.get("detail")\n        declaration_sha256 = value.get("declaration_sha256")\n        if not isinstance(source, str):\n            raise _fail("SDAI-TRACE-002", "provenance source must be a string")\n        if not isinstance(line, int) or isinstance(line, bool):\n            raise _fail("SDAI-TRACE-002", "provenance line must be an integer")\n        if detail is not None and not isinstance(detail, str):\n            raise _fail("SDAI-TRACE-002", "provenance detail must be null or a string")\n        if declaration_sha256 is not None and not isinstance(declaration_sha256, str):\n            raise _fail(\n                "SDAI-TRACE-002",\n                "provenance declaration_sha256 must be null or a string",\n            )\n        return cls(\n            source=source,\n            line=line,\n            detail=detail,\n            declaration_sha256=declaration_sha256,\n        )\n\n\ndef trace_provenance_for_path(\n    project_root: Path,\n    path: Path,\n    *,\n    line: int,\n    detail: str | None = None,\n) -> TraceProvenance:\n    root = project_root.resolve()\n    candidate = path if path.is_absolute() else root / path\n    try:\n        ensure_within_project(root, candidate, label="trace provenance source")\n    except PathSafetyError as exc:\n        raise _fail(\n            "SDAI-TRACE-002",\n            "trace provenance source must stay inside the project root",\n        ) from exc\n    try:\n        relative = candidate.relative_to(root)\n    except ValueError as exc:\n        raise _fail(\n            "SDAI-TRACE-002",\n            "trace provenance source must stay inside the project root",\n        ) from exc\n    current = root\n    for part in relative.parts:\n        current = current / part\n        if current.exists() and current.is_symlink():\n            raise _fail(\n                "SDAI-TRACE-002",\n                f"trace provenance source contains a symlink component: {relative.as_posix()}",\n            )\n    if candidate.is_symlink() or not candidate.is_file():\n        raise _fail(\n            "SDAI-TRACE-002",\n            f"trace provenance source must be a regular non-symlink file: {relative.as_posix()}",\n        )\n    try:\n        digest = _sha256_bytes(candidate.read_bytes())\n    except OSError as exc:\n        raise _fail(\n            "SDAI-TRACE-002",\n            f"unable to read trace provenance source {relative.as_posix()}: {exc}",\n        ) from exc\n    return TraceProvenance(\n        source=relative.as_posix(),\n        line=line,\n        detail=detail,\n        declaration_sha256=digest,\n    )\n\n\ndef _canonical_provenance(\n'''
          replace_once(path, old, new)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run trace graph contract tests
        run: pytest -q tests/test_trace_graph_v010.py
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdai/trace_graph.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden trace graph provenance and metadata (#103)"
          git push origin HEAD:agent/issue-103-trace-graph-contract
