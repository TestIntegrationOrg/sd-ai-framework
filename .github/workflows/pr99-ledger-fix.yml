name: PR99 Ledger Fix

on:
  push:
    branches:
      - agent/issue-92-execution-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-92-execution-ledger
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"patch anchor is not unique in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          source = Path("src/sdai/execution_ledger.py")
          replace_once(
              source,
              "\n\ndef _atomic_write(path: Path, content: bytes) -> None:\n",
              '''\n\ndef _fsync_directory(directory: Path) -> None:\n    """Durably persist a directory entry update where the platform supports it."""\n\n    if os.name == "nt":\n        return\n    flags = os.O_RDONLY\n    if hasattr(os, "O_DIRECTORY"):\n        flags |= os.O_DIRECTORY\n    try:\n        fd = os.open(directory, flags)\n    except OSError as exc:\n        raise _fail(\n            "SDAI-LEDGER-007",\n            f"unable to open parent directory for durability sync: {exc}",\n        ) from exc\n    try:\n        os.fsync(fd)\n    except OSError as exc:\n        raise _fail(\n            "SDAI-LEDGER-007",\n            f"unable to sync parent directory after atomic replacement: {exc}",\n        ) from exc\n    finally:\n        os.close(fd)\n\n\ndef _atomic_write(path: Path, content: bytes) -> None:\n''',
          )
          replace_once(
              source,
              "        os.replace(temp, path)\n    finally:\n",
              "        os.replace(temp, path)\n        _fsync_directory(path.parent)\n    finally:\n",
          )
          replace_once(
              source,
              "    def write_task_brief(self, task_id: str, content: str) -> HashBinding:\n",
              '''    def _validate_completion_bindings(\n        self,\n        bindings: tuple[HashBinding, ...],\n    ) -> None:\n        for binding in bindings:\n            candidate = _safe_existing_path(\n                self.project_root,\n                self.project_root.joinpath(*PurePosixPath(binding.source).parts),\n                label="task completion binding",\n            )\n            if candidate.is_symlink() or not candidate.is_file():\n                raise _fail(\n                    "SDAI-LEDGER-005",\n                    f"task completion binding is not a regular file: {binding.source}",\n                )\n            try:\n                actual = _sha256_bytes(candidate.read_bytes())\n            except OSError as exc:\n                raise _fail(\n                    "SDAI-LEDGER-005",\n                    f"unable to read task completion binding {binding.source}: {exc}",\n                ) from exc\n            if actual != binding.sha256:\n                raise _fail(\n                    "SDAI-LEDGER-005",\n                    f"task completion binding hash mismatch: {binding.source}",\n                )\n\n    def write_task_brief(self, task_id: str, content: str) -> HashBinding:\n''',
          )
          replace_once(
              source,
              "            self._validate_transition(state, kind, task, commit, bindings)\n            sequence = len(events) + 1\n",
              '''            self._validate_transition(state, kind, task, commit, bindings)\n            if kind == "task.completed":\n                self._validate_completion_bindings(bindings)\n            sequence = len(events) + 1\n''',
          )

          crash = Path("tests/test_execution_ledger_crash_recovery_v09.py")
          replace_once(crash, "os.write(1, b'locked\\\\n')\nos.fsync(1)\nos._exit(23)\n", "os.write(1, b'locked\\\\n')\nos._exit(23)\n")
          replace_once(
              crash,
              '    assert not reloaded.lock_path.exists()\n',
              '    assert reloaded.lock_path.exists(), "ledger.lock is a persistent advisory-lock anchor"\n    with reloaded._lock():\n        pass\n',
          )

          tests = Path("tests/test_execution_ledger_v09.py")
          anchor = '''\n\ndef test_duplicate_or_conflicting_terminal_task_events_are_rejected(tmp_path: Path) -> None:\n'''
          new_test = '''\n\ndef test_completion_rejects_forged_or_stale_hash_bindings(tmp_path: Path) -> None:\n    ledger = _ledger(tmp_path)\n    _start_task(ledger)\n\n    missing = HashBinding(\n        "artifact",\n        f"specs/{FEATURE}/missing.txt",\n        "sha256:" + "1" * 64,\n    )\n    with pytest.raises(ExecutionLedgerError, match="not a regular file"):\n        ledger.append_event(\n            "task.completed",\n            task_id="TASK-001",\n            git_commit=IMPLEMENTED,\n            bindings=(missing,),\n        )\n\n    output = tmp_path / "specs" / FEATURE / "stale.txt"\n    output.write_text("original\\n", encoding="utf-8")\n    stale = ledger.binding_for_file(output, kind="artifact")\n    output.write_text("changed\\n", encoding="utf-8")\n    with pytest.raises(ExecutionLedgerError, match="hash mismatch"):\n        ledger.append_event(\n            "task.completed",\n            task_id="TASK-001",\n            git_commit=IMPLEMENTED,\n            bindings=(stale,),\n        )\n\n    assert ledger.reconstruct().task_map()["TASK-001"].status == "started"\n''' + anchor
          replace_once(tests, anchor, new_test)

          docs = Path("docs/EXECUTION-LEDGER.md")
          replace_once(
              docs,
              "├── ledger.lock            # present only while a process holds the ledger\n",
              "├── ledger.lock            # persistent anchor; OS lock ownership is transient\n",
          )
          replace_once(
              docs,
              "A per-run `ledger.lock` is acquired before reads that must be consistent with a following mutation and before append/checkpoint operations. The current v1 lock is fail-closed: another visible lock owner blocks mutation rather than allowing two processes to assign the same sequence.\n\nIf a process is terminated in the middle of an append, restart validation checks the JSONL boundary/hash chain before any state is reconstructed. A partial final record therefore cannot silently become completion truth.\n",
              "A per-run `ledger.lock` is a persistent lock anchor. SDAI acquires an OS advisory lock on that anchor before reads that must be consistent with a following mutation and before append/checkpoint operations. The current v1 lock is fail-closed: another live lock owner blocks mutation rather than allowing two processes to assign the same sequence. File existence alone never means the ledger is locked.\n\nOS lock ownership is released automatically when a process exits, including hard process termination, so the persistent anchor does not brick restart. If a process is terminated in the middle of an append, restart validation checks the JSONL boundary/hash chain before any state is reconstructed. A partial final record therefore cannot silently become completion truth.\n",
          )
          replace_once(
              docs,
              "2. at least one persistent `artifact` or `evidence` SHA-256 binding.\n\nA chat message, provider response, or plain `\"done\"` flag cannot create durable completion truth.\n",
              "2. at least one persistent `artifact` or `evidence` SHA-256 binding whose current regular non-symlink file exists and matches the declared digest at completion time.\n\nA chat message, provider response, forged digest, missing file, or plain `\"done\"` flag cannot create durable completion truth. Historical reconstruction does not re-read those files; #93 performs current-evidence freshness checks again before resume may skip work.\n",
          )
          replace_once(
              docs,
              "Writes are atomic. Record writes are rejected after the task becomes terminal.\n",
              "Writes are atomic. On POSIX, the parent directory is also fsynced after replacement so the new directory entry is durable across power loss; Windows keeps the atomic replacement without unsupported directory fsync. Record writes are rejected after the task becomes terminal.\n",
          )
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run focused ledger tests
        run: |
          pytest -q tests/test_execution_ledger_v09.py tests/test_execution_ledger_crash_recovery_v09.py tests/test_execution_ledger_schema_strictness_v09.py
      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sdai/execution_ledger.py tests/test_execution_ledger_v09.py tests/test_execution_ledger_crash_recovery_v09.py docs/EXECUTION-LEDGER.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: address durable ledger review findings (#92)"
          git push origin HEAD:agent/issue-92-execution-ledger
